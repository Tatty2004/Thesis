[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bombpot"
version = "0.1.0"
description = "GTO solving for heads-up double-board bomb pots: toy games, Hold'em, PLO"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "POT", "pyyaml", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "open_spiel"]

[tool.setuptools.packages.find]
include = ["bombpot*"]

[tool.setuptools.package-data]
"bombpot.experiments" = ["configs/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long cross-checks, skipped unless --runslow"]
